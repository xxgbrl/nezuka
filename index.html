const msgEl = document.getElementById('msg');
const respEl = document.getElementById('resp');
const input = document.getElementById('passInput');
const btn = document.getElementById('enterBtn');
const footerEl = document.getElementById('footer');

let msgIndex = 0;

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function typeText(el, text, speed, onDone) {
  el.innerHTML = '';
  let i = 0;
  function next() {
    if (i <= text.length) {
      el.innerHTML = text.slice(0, i) + '<span class="nz-cursor"></span>';
      i++;
      setTimeout(next, speed + Math.random() * 40);
    } else {
      if (onDone) onDone();
    }
  }
  next();
}

function scheduleNext() {
  setTimeout(() => {
    msgIndex = (msgIndex + 1) % ambient.length;
    typeText(msgEl, ambient[msgIndex], 38, scheduleNext);
  }, 4200);
}

typeText(msgEl, ambient[0], 38, scheduleNext);

function getResponse(val) {
  const lower = val.toLowerCase();
  for (const [kw, replies] of Object.entries(keywords)) {
    if (lower.includes(kw)) return rand(replies);
  }
  return rand(generic);
}

function handleInput() {
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  respEl.classList.add('fade');
  setTimeout(() => {
    respEl.textContent = '— ' + getResponse(val) + ' —';
    respEl.classList.remove('fade');
  }, 300);
}

btn.addEventListener('click', handleInput);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleInput(); });

const footerChars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz0123456789!@#$%^&*?~';
function randomFooter() {
  let s = '';
  for (let i = 0; i < 7; i++) s += footerChars[Math.floor(Math.random() * footerChars.length)];
  footerEl.textContent = '[ ' + s + ' ]';
}
randomFooter();
setInterval(randomFooter, 1000);
